<!-- Pantalla de Ultimos movientos (transactions.html):

 Reemplazar lista de transacciones:
  Reemplazar la lista de movimientos codificada en el HTML con una lista ficticia de transacciones (listaTransacciones). Debes reemplazar esta lista ficticia con tu lista real de transacciones.
 Filtrar por tipo de movimiento:
  Agregar un elemento select en el formulario para filtrar los movimientos por tipo (compra, depósito, transferencia recibida) y utilizar jQuery para mostrar dinámicamente los últimos movimientos según el tipo seleccionado en el filtro
 Cada vez que se selecciona un tipo de transacción en el filtro, se llama a la función mostrarUltimosMovimientos(filtro) que muestra los movimientos correspondientes en la lista. La función getTipoTransaccion(tipo) se utiliza para obtener el tipo de transacción en formato legible para mostrarlo en la lista.
 
 Notas:
 - (Limite establecido 5 transacciones) 
 - Solo se agrego filtro para deposito o envio ya que no se han generado mas tipos de transacciones con anterioridad. -->

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <title>Billetera Digital - Últimos Movimientos</title>
    <link rel="stylesheet" href="styles.css">

<body>

    <header>
    </header>

    <main>
        <div class="tarjeta">
            <!-- Titulo h2-->
            <h2 class="text-center">Últimos Movimientos</h2>
            <div class="mb-3"> <!-- Filtro de tipo de movimiento-->
                <label class="form-label">Filtrar por tipo:</label>
                <select id="filtroTipo" class="form-select">
                    <option value="todos">Todos</option>
                    <option value="deposito">Depósitos</option>
                    <option value="envio">Envíos</option>
                </select>
            </div>
            <!-- Ultimos 4 movimientos -->
            <div class="list-group">
                <div class="movimiento">
                    <p class="tipo_transaccion"></p>
                    <p class="fecha_transacion"></p>
                    <div class="text-success fw-bold"></div>
                </div>
            </div>

            <!-- Volver al Menú Principal-->
            <a href="menu.html" class="btn btn-primary w-100">Volver al Menú Principal</a>
        </div>
    </main>

    <!-- Footer con la firma-->
    <footer>
        <p class="footer">© 2026 Ana Marión Escobar</p>
    </footer>

    <!-- Script Jquery-->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Script Bootstrap-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Script al archivo js-->
    <script src="js/script.js"></script>
    <!-- Script jquery-->
    <script>
        $(document).ready(function () {
            mostrarMovimientos();
            $('#filtroTipo').on('change', filtrarMovimientos);
        });
    </script>
</body>

</html>
