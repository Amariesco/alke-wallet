 <!-- Pantalla de depósito (deposit.html):

 Mostrar el saldo actual:
  Al cargar la página, utilizar jQuery para obtener el saldo actual del usuario desde el Local Storage y luego lo mostramos en el formulario de depósito. Esto permite que el usuario vea su saldo actual antes de realizar el depósito.
 Agregar una leyenda con el monto depositado:
  Después de realizar el depósito, agregar una leyenda debajo del formulario de depósito que muestra el monto depositado utilizando jQuery. Esto le proporciona al usuario una confirmación visual del monto que ha depositado.
 Mejoras en el mensaje de éxito:
  Utilizar una alerta de Bootstrap para mostrar un mensaje de éxito después de realizar el depósito. La alerta de Bootstrap se crea dinámicamente con jQuery y se agrega al elemento #alert-container.
 Redirigir después del depósito:
  Redirigir al usuario a la pantalla del menú principal después de un retraso de 2 segundos utilizando setTimeout. Esto le da tiempo al usuario para ver el mensaje de éxito antes de ser redirigido.


 Notas:
-->

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <title>Billetera Digital - Depositar</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
    </header>
    <main>
        <div class="tarjeta">
            <h2 class="text-center">Depositar</h2> <!-- Titulo -->
            <div class="alert alert-info text-center" id="saldoActual"></div> <!-- Agregado para alertas -->
            <form action="menu.html" id="formDeposito">
                <div class="mb-3">
                    <label class="form-label">Monto a Depositar</label>
                    <input type="number" id="montoDeposito" class="form-control" placeholder="0" required>
                </div>

                <div class="alert alert-info">
                    Los depósitos pueden tardar hasta 24 horas en reflejarse.
                </div>

                <button type="submit" class="btn btn-success w-100">Realizar Depósito</button>
                <a href="menu.html" class="btn btn-outline-secondary w-100">Cancelar</a>
            </form>
            <div id="montoDepositado" style="display: none;"></div>
        </div>

    </main>

    <!-- Footer con la firma-->
    <footer>
        <p class="footer">© 2026 Ana Marión Escobar</p>
    </footer>

    <!-- Script Jquery-->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Script Bootstrap-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Script al archivo js-->
    <script src="js/script.js"></script>
    <!-- Script jquery-->
    <script>
         $(document).ready(function() {
        mostrarSaldoActual();
        $('#formDeposito').submit(realizarDeposito);
         });
    </script>
</body>

</html>
