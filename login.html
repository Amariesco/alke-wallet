 <!-- APantalla de inicio de sesión (login.html):
 Uso de Selectores de jQuery:
  En lugar de utilizar document.getElementById para obtener los valores de los campos de correo electrónico y contraseña, hemos utilizado los selectores de jQuery para obtener los valores directamente con $('#email').val() y $('#password').val(). Esto hace que el código sea más conciso y legible.
 Uso de jQuery para enviar el formulario:
  Reemplazar el evento submit en el formulario con $('#loginForm').submit(...) para manejar el envío del formulario utilizando jQuery. Esto nos permite tener un código más claro y centralizado.
 Uso de jQuery para redirigir a la página del menú principal:
  En lugar de utilizar window.location.href para redirigir al usuario después del inicio de sesión, utilizar jQuery para hacerlo con window.location.href = '../HTML/menu.html';. 
 Uso de alertas de Bootstrap:
  En lugar de usar las alertas predeterminadas de JavaScript utilizar las alertas de Bootstrap para mostrar mensajes de éxito o error con un diseño más atractivo y personalizable.

 Notas:
 - Credenciales validas agregadas a "pass.txt" 
 - Agregados ID para email y password -->

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <title>Billetera Digital - Login</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Titulo -->
    <header>
    </header>
    <main>
        <div class="tarjeta">
            <!-- Titulo h2 -->
            <h2 class="text-center mb-4">Inicio de sesión</h2>
            <div id="alert-container"></div>  <!-- Agregado para mostrar las alertas -->
            <!-- Formulario Email -->
            <form id="loginForm">
                <div class="mb-3"> 
                    <label class="form-label">Email</label>
                    <input type="email" id="emailInput" class="form-control" required> <!-- agregado id -->
                </div>
                <!-- formulario contraseña -->
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" id="passwordInput" class="form-control" required> <!-- agregado id -->
                </div>
                <!-- Botón Iniciar Sesión -->
                <button type="submit" class="btn btn-primary w-100">Iniciar Sesión</button>
            </form>
        </div>

    </main>

    <!-- Footer con la firma-->
    <footer>
        <p class="footer">© 2026 Ana Marión Escobar</p>
    </footer>

    <!-- Script Jquery-->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Script Bootstrap-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Script al archivo js-->
    <script src="js/script.js"></script>
    
    <script> 
        $(document).ready(function() {
            $('#loginForm').submit(validarLogin);
        });
    </script> <!-- Script Jquery para validar el login-->

</body>

</html>
